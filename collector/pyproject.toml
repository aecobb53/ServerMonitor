[project]
name = "server-manager-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
]
