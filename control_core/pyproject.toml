[project]
name = "server-monitor-control-core"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "pydantic",
    "python-multipart",
    "pyyaml",
    "requests",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
