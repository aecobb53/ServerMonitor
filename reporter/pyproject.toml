[project]
name = "server-manager-reporter"
version = "0.1.1"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
server-manager-reporter = "src.main:app"
