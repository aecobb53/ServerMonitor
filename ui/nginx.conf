server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy static assets (favicon etc.) from the API service
    location /static/ {
        proxy_pass https://control-core.nax.lol;
        proxy_ssl_server_name on;
        proxy_set_header Host control-core.nax.lol;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass https://control-core.nax.lol;
        proxy_ssl_server_name on;
        proxy_set_header Host control-core.nax.lol;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Per-server admin API
    location /control-core/admin/ {
        proxy_pass https://control-core.nax.lol;
        proxy_ssl_server_name on;
        proxy_set_header Host control-core.nax.lol;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
