services:
  collector:
    build: ./collector
    image: ghcr.io/${GHCR_USERNAME}/collector:latest
    container_name: Collector
    env_file:
      - .env
    environment:
      LOG_LEVEL: DEBUG
      SERVER_MONITOR_RECONCILE_SECONDS: 15
      # SERVER_MONITOR_STORAGE: /app/storage
      # SERVER_MONITOR_RECONCILE_SECONDS: "60"
      # SERVER_MONITOR_LOG_TAIL: "10000"
      # SERVER_MONITOR_MAX_HISTORY: "500"
      # SERVER_MONITOR_MAX_ERRORS: "100"
    volumes:
      - ./shared/states:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock:ro

  reporter:
    build: ./reporter
    image: ghcr.io/${GHCR_USERNAME}/reporter:latest
    container_name: Reporter
    env_file:
      - .env
    environment:
      LOG_LEVEL: DEBUG
      # SERVER_MONITOR_STORAGE: /app/storage
      # SERVER_MONITOR_CALLBACK_URL: example_callback
      # REPORTER_RETRY_INITIAL_SECONDS: "1"
      # REPORTER_RETRY_MAX_SECONDS: "60"
    volumes:
      - ./shared/states:/app/storage

  control-core:
    build: ./control_core
    image: ghcr.io/${GHCR_USERNAME}/control-core:latest
    container_name: ControlCore
    env_file:
      - .env
    environment:
      LOG_LEVEL: DEBUG
      # CONTROL_CORE_KEY: "${CONTROL_CORE_KEY:?CONTROL_CORE_KEY is required}"
    volumes:
      - ./shared/states:/app/storage:ro
      - ./control_core/content:/app/content
      - /srv2t/server_monitor:/app/images
    ports:
      - "8210:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control_core.rule=Host(`control-core.nax.lol`)"
      - "traefik.http.routers.control_core.entrypoints=websecure"
      - "traefik.http.routers.control_core.tls.certresolver=myresolver"
  ui:
    build: ./ui
    image: ghcr.io/${GHCR_USERNAME}/server-monitor-ui:latest
    container_name: GameServerMonitorUI
    ports:
      - "8209:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server_monitor_ui.rule=Host(`server-monitor-ui.nax.lol`)"
      - "traefik.http.routers.server_monitor_ui.entrypoints=websecure"
      - "traefik.http.routers.server_monitor_ui.tls.certresolver=myresolver"

